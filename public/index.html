<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayFinder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="#/properties" class="logo">StayFinder<span class="logo-dot">.</span></a>
      <nav id="nav" class="pill-nav" aria-label="Main navigation"></nav>
      <div id="user-nav" class="user-nav"></div>
      <div class="mobile-actions">
        <button id="finder-toggle" class="finder-toggle" type="button" aria-expanded="false" aria-controls="finder-panel" aria-label="Open search">
          <span class="finder-icon" aria-hidden="true">⌕</span>
        </button>
        <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
          <span class="menu-icon" aria-hidden="true">☰</span>
        </button>
      </div>
    </header>
    <div id="mobile-menu" class="mobile-menu" hidden>
      <nav class="mobile-menu-content" aria-label="Mobile navigation"></nav>
    </div>
    <div id="finder-panel" class="finder-panel" hidden>
      <div class="finder-content" id="finder-content"></div>
    </div>
    <main id="app"></main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
